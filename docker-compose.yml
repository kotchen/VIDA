services:
  ai-video-transcriber:
    build: .
    ports:
      - "8000:8000"
    environment:
      # 必需：OpenAI API密钥（请在.env文件中设置或直接修改）
      - OPENAI_API_KEY=${OPENAI_API_KEY:-your_openai_api_key_here}
      # 可选：自定义OpenAI端点
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      # 可选：Whisper模型大小
      - WHISPER_MODEL_SIZE=${WHISPER_MODEL_SIZE:-base}
      # 可选：本地上传单文件大小上限（MB），与本地环境变量一致
      - UPLOAD_MAX_MB=${UPLOAD_MAX_MB:-200}
      # VIDA 2.0 startup configuration. VIDA_PROFILE_MASTER_KEY is required;
      # generate it once, keep it secret, and back it up with ./data/v2.
      - V2_MAX_CONCURRENT_JOBS=${V2_MAX_CONCURRENT_JOBS:-2}
      - V2_UPLOAD_MAX_GB=${V2_UPLOAD_MAX_GB:-5}
      - VIDA_PROFILE_MASTER_KEY=${VIDA_PROFILE_MASTER_KEY:-}
      # 服务器配置
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Persistent VIDA 2.0 SQLite database, source media, and artifacts.
      - ./data/v2:/app/data/v2
      # 1.x history can optionally be persisted separately:
      # - ./temp:/app/temp
    restart: unless-stopped
    # Keep one application process: SSE delivery is process-local and job
    # concurrency is controlled by V2_MAX_CONCURRENT_JOBS.
    
    # 资源限制（可选）
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G
